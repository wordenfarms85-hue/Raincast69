<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agricast — Radar</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #050c14;
  --bg2: #091525;
  --green: #00ffa3;
  --blue: #00c8ff;
  --amber: #ffb300;
  --text: #e8f4ff;
  --muted: #4a7a9b;
  --border: #1a3a55;
}
html, body { height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; }

/* NAV */
nav {
display: flex;
align-items: center;
justify-content: space-between;
padding: 12px 20px;
background: rgba(5,12,20,0.95);
border-bottom: 1px solid var(–border);
flex-shrink: 0;
z-index: 100;
}
.nav-logo { font-family: ‘Bebas Neue’, sans-serif; font-size: 24px; letter-spacing: 3px; color: var(–text); text-decoration: none; }
.nav-logo span { color: var(–blue); }
.nav-links { display: flex; gap: 16px; align-items: center; }
.nav-link { font-family: ‘DM Mono’, monospace; font-size: 11px; letter-spacing: 2px; color: var(–muted); text-decoration: none; transition: color 0.2s; }
.nav-link:hover { color: var(–text); }
.nav-link.active { color: var(–blue); }
.nav-cta { background: var(–green); color: #000; font-family: ‘DM Mono’, monospace; font-weight: 500; font-size: 11px; letter-spacing: 2px; padding: 8px 18px; text-decoration: none; }

/* LAYER CONTROLS */
.controls {
display: flex;
align-items: center;
gap: 8px;
padding: 8px 20px;
background: var(–bg2);
border-bottom: 1px solid var(–border);
flex-shrink: 0;
overflow-x: auto;
-webkit-overflow-scrolling: touch;
}
.layer-btn {
font-family: ‘DM Mono’, monospace;
font-size: 10px;
letter-spacing: 1px;
color: var(–muted);
background: var(–bg);
border: 1px solid var(–border);
padding: 6px 14px;
cursor: pointer;
white-space: nowrap;
transition: all 0.15s;
flex-shrink: 0;
}
.layer-btn:hover { color: var(–text); border-color: var(–muted); }
.layer-btn.active { color: var(–blue); border-color: var(–blue); background: rgba(0,200,255,0.08); }
.controls-label { font-family: ‘DM Mono’, monospace; font-size: 9px; letter-spacing: 2px; color: var(–border); flex-shrink: 0; }

/* RADAR FRAME */
.radar-wrap {
flex: 1;
position: relative;
overflow: hidden;
}
#windyFrame {
width: 100%;
height: 100%;
border: none;
display: block;
}

/* LOADING */
.radar-loading {
position: absolute;
inset: 0;
display: flex;
align-items: center;
justify-content: center;
flex-direction: column;
gap: 12px;
background: var(–bg);
pointer-events: none;
transition: opacity 0.5s;
}
.radar-loading.hidden { opacity: 0; }
.loading-logo { font-family: ‘Bebas Neue’, sans-serif; font-size: 32px; letter-spacing: 4px; color: var(–text); }
.loading-logo span { color: var(–blue); }
.loading-sub { font-family: ‘DM Mono’, monospace; font-size: 10px; letter-spacing: 3px; color: var(–muted); }
.loading-bar { width: 200px; height: 2px; background: var(–border); border-radius: 1px; overflow: hidden; }
.loading-fill { height: 100%; background: var(–blue); border-radius: 1px; animation: load 2s ease forwards; }
@keyframes load { from { width: 0; } to { width: 100%; } }
</style>

</head>
<body>

<!-- NAV -->

<nav>
  <a href="https://agricast.farm/app.html" class="nav-logo">AGRI<span>CAST</span></a>
  <div class="nav-links">
    <a href="https://agricast.farm/app.html" class="nav-link">HOME</a>
    <a href="https://agricast.farm/radar.html" class="nav-link active">RADAR</a>
    <a href="https://agricast.farm/app.html" class="nav-cta">LAUNCH APP</a>
  </div>
</nav>

<!-- LAYER CONTROLS -->

<div class="controls">
  <span class="controls-label">LAYER:</span>
  <button class="layer-btn active" onclick="setLayer('radar')">&#127783; RADAR</button>
  <button class="layer-btn" onclick="setLayer('wind')">&#127788; WIND</button>
  <button class="layer-btn" onclick="setLayer('rain')">&#127783; PRECIP</button>
  <button class="layer-btn" onclick="setLayer('temp')">&#127777; TEMP</button>
  <button class="layer-btn" onclick="setLayer('snowcover')">&#10052; SNOW</button>
  <button class="layer-btn" onclick="setLayer('lightning')">&#9889; LIGHTNING</button>
  <button class="layer-btn" onclick="setLayer('clouds')">&#9729; CLOUDS</button>
  <button class="layer-btn" onclick="setLayer('satellite')">&#127759; SATELLITE</button>
</div>

<!-- RADAR -->

<div class="radar-wrap">
  <div class="radar-loading" id="loadingOverlay">
    <div class="loading-logo">AGRI<span>CAST</span></div>
    <div class="loading-sub">LOADING RADAR</div>
    <div class="loading-bar"><div class="loading-fill"></div></div>
  </div>
  <iframe id="windyFrame"
    src="https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=inch&metricTemp=°F&metricWind=mph&zoom=5&overlay=radar&product=radar&level=surface&lat=39.5&lon=-98.5&detailLat=39.5&detailLon=-98.5&marker=false&pressure=true&message=true"
    frameborder="0"
    allowfullscreen
    onload="document.getElementById('loadingOverlay').classList.add('hidden')">
  </iframe>
</div>

<script>
var currentLayer = 'radar';
var baseUrl = 'https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=inch&metricTemp=°F&metricWind=mph&zoom=5&level=surface&lat=39.5&lon=-98.5&detailLat=39.5&detailLon=-98.5&marker=false&pressure=true&message=true';

function setLayer(layer) {
  currentLayer = layer;
  document.querySelectorAll('.layer-btn').forEach(function(b){ b.classList.remove('active'); });
  event.target.classList.add('active');

  var overlay = layer;
  var product = layer;

  // Map layer names to Windy params
  var layerMap = {
    radar:     { overlay:'radar',     product:'radar' },
    wind:      { overlay:'wind',      product:'ecmwf' },
    rain:      { overlay:'rain',      product:'ecmwf' },
    temp:      { overlay:'temp',      product:'ecmwf' },
    snowcover: { overlay:'snowcover', product:'ecmwf' },
    lightning: { overlay:'lightning', product:'radar' },
    clouds:    { overlay:'clouds',    product:'ecmwf' },
    satellite: { overlay:'satellite', product:'satellite' }
  };

  var params = layerMap[layer] || { overlay:layer, product:'ecmwf' };
  var frame = document.getElementById('windyFrame');
  var loading = document.getElementById('loadingOverlay');
  loading.classList.remove('hidden');
  frame.src = baseUrl + '&overlay=' + params.overlay + '&product=' + params.product;
  frame.onload = function(){ loading.classList.add('hidden'); };
}
</script>

</body>
</html>
