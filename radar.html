<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agricast — Radar</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #050c14;
  --bg2: #091525;
  --green: #00ffa3;
  --blue: #00c8ff;
  --amber: #ffb300;
  --text: #e8f4ff;
  --muted: #4a7a9b;
  --border: #1a3a55;
}
html, body { height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; }

/* NAV */
nav {
display: flex;
align-items: center;
justify-content: space-between;
padding: 12px 20px;
background: rgba(5,12,20,0.95);
border-bottom: 1px solid var(–border);
flex-shrink: 0;
z-index: 100;
}
.nav-logo { font-family: ‘Bebas Neue’, sans-serif; font-size: 24px; letter-spacing: 3px; color: var(–text); text-decoration: none; }
.nav-logo span { color: var(–blue); }
.nav-links { display: flex; gap: 16px; align-items: center; }
.nav-link { font-family: ‘DM Mono’, monospace; font-size: 11px; letter-spacing: 2px; color: var(–muted); text-decoration: none; transition: color 0.2s; }
.nav-link:hover { color: var(–text); }
.nav-link.active { color: var(–blue); }
.nav-cta { background: var(–green); color: #000; font-family: ‘DM Mono’, monospace; font-weight: 500; font-size: 11px; letter-spacing: 2px; padding: 8px 18px; text-decoration: none; }

/* LAYER CONTROLS */
.controls {
display: flex;
align-items: center;
gap: 8px;
padding: 8px 20px;
background: var(–bg2);
border-bottom: 1px solid var(–border);
flex-shrink: 0;
overflow-x: auto;
-webkit-overflow-scrolling: touch;
}
.layer-btn {
font-family: ‘DM Mono’, monospace;
font-size: 10px;
letter-spacing: 1px;
color: var(–muted);
background: var(–bg);
border: 1px solid var(–border);
padding: 6px 14px;
cursor: pointer;
white-space: nowrap;
transition: all 0.15s;
flex-shrink: 0;
}
.layer-btn:hover { color: var(–text); border-color: var(–muted); }
.layer-btn.active { color: var(–blue); border-color: var(–blue); background: rgba(0,200,255,0.08); }
.controls-label { font-family: ‘DM Mono’, monospace; font-size: 9px; letter-spacing: 2px; color: var(–border); flex-shrink: 0; }

/* RADAR FRAME */
.radar-wrap {
flex: 1;
position: relative;
overflow: hidden;
}
#windyFrame {
width: 100%;
height: 100%;
border: none;
display: block;
}

/* LOADING */
.radar-loading {
position: absolute;
inset: 0;
display: flex;
align-items: center;
justify-content: center;
flex-direction: column;
gap: 12px;
background: var(–bg);
pointer-events: none;
transition: opacity 0.5s;
}
.radar-loading.hidden { opacity: 0; }
.loading-logo { font-family: ‘Bebas Neue’, sans-serif; font-size: 32px; letter-spacing: 4px; color: var(–text); }
.loading-logo span { color: var(–blue); }
.loading-sub { font-family: ‘DM Mono’, monospace; font-size: 10px; letter-spacing: 3px; color: var(–muted); }
.loading-bar { width: 200px; height: 2px; background: var(–border); border-radius: 1px; overflow: hidden; }
.loading-fill { height: 100%; background: var(–blue); border-radius: 1px; animation: load 2s ease forwards; }
@keyframes load { from { width: 0; } to { width: 100%; } }
</style>

</head>
<body>

<!-- NAV -->

<nav>
  <a href="https://agricast.farm/app.html" class="nav-logo">AGRI<span>CAST</span></a>
  <div class="nav-links">
    <a href="https://agricast.farm/app.html" class="nav-link">HOME</a>
    <a href="https://agricast.farm/radar.html" class="nav-link active">RADAR</a>
    <a href="https://agricast.farm/app.html" class="nav-cta">LAUNCH APP</a>
  </div>
</nav>

<!-- LAYER CONTROLS -->

<div class="controls">
  <button id="gpsBtn" class="layer-btn" onclick="initLocation()" style="border-color:#00c8ff;color:#00c8ff;">📍 GPS</button>
  <span class="controls-label">LAYER:</span>
  <button class="layer-btn active" onclick="setLayer('radar', this)">&#127783; RADAR</button>
  <button class="layer-btn" onclick="setLayer('wind', this)">&#127788; WIND</button>
  <button class="layer-btn" onclick="setLayer('rain', this)">&#127783; PRECIP</button>
  <button class="layer-btn" onclick="setLayer('temp', this)">&#127777; TEMP</button>
  <button class="layer-btn" onclick="setLayer('snowcover', this)">&#10052; SNOW</button>
  <button class="layer-btn" onclick="setLayer('lightning', this)">&#9889; LIGHTNING</button>
  <button class="layer-btn" onclick="setLayer('clouds', this)">&#9729; CLOUDS</button>
  <button class="layer-btn" onclick="setLayer('satellite', this)">&#127759; SATELLITE</button>
</div>

<!-- RADAR -->

<div class="radar-wrap">
  <div class="radar-loading" id="loadingOverlay">
    <div class="loading-logo">AGRI<span>CAST</span></div>
    <div class="loading-sub">LOADING RADAR</div>
    <div class="loading-bar"><div class="loading-fill"></div></div>
  </div>
  <iframe id="windyFrame" src="" frameborder="0" allowfullscreen></iframe>
</div>

<script>
var currentLayer = 'radar';
var userLat = 39.5, userLon = -98.5, userZoom = 5;

function buildUrl(lat, lon, zoom, overlay, product) {
  return 'https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=inch&metricTemp=°F&metricWind=mph'
    + '&zoom=' + (zoom||5)
    + '&level=surface'
    + '&lat=' + lat + '&lon=' + lon
    + '&detailLat=' + lat + '&detailLon=' + lon
    + '&overlay=' + (overlay||'radar')
    + '&product=' + (product||'radar')
    + '&marker=true&pressure=true&message=true';
}

// Try to get GPS on load
function initLocation() {
  if (!navigator.geolocation) { loadRadar(userLat, userLon); return; }
  var gpsBtn = document.getElementById('gpsBtn');
  if (gpsBtn) gpsBtn.textContent = '⟳ LOCATING...';
  navigator.geolocation.getCurrentPosition(
    function(pos) {
      userLat = pos.coords.latitude;
      userLon = pos.coords.longitude;
      userZoom = 8; // closer zoom for local radar
      loadRadar(userLat, userLon);
      if (gpsBtn) gpsBtn.textContent = '📍 MY LOCATION';
    },
    function() {
      loadRadar(userLat, userLon); // fallback to US center
      if (gpsBtn) gpsBtn.textContent = '📍 GPS';
    },
    { timeout: 8000 }
  );
}

function loadRadar(lat, lon) {
  var layerMap = {
    radar:     { overlay:'radar',     product:'radar' },
    wind:      { overlay:'wind',      product:'ecmwf' },
    rain:      { overlay:'rain',      product:'ecmwf' },
    temp:      { overlay:'temp',      product:'ecmwf' },
    snowcover: { overlay:'snowcover', product:'ecmwf' },
    lightning: { overlay:'lightning', product:'radar' },
    clouds:    { overlay:'clouds',    product:'ecmwf' },
    satellite: { overlay:'satellite', product:'satellite' }
  };
  var params = layerMap[currentLayer] || { overlay:'radar', product:'radar' };
  var frame = document.getElementById('windyFrame');
  var loading = document.getElementById('loadingOverlay');
  loading.classList.remove('hidden');
  frame.src = buildUrl(lat, lon, userZoom, params.overlay, params.product);
  frame.onload = function(){ loading.classList.add('hidden'); };
}

function setLayer(layer, btn) {
  currentLayer = layer;
  document.querySelectorAll('.layer-btn').forEach(function(b){ b.classList.remove('active'); });
  if (btn) btn.classList.add('active');

  var overlay = layer;
  var product = layer;

  var params = layerMap[layer] || { overlay:layer, product:'ecmwf' };
  loadRadar(userLat, userLon);
}
window.onload = initLocation;
</script>

</body>
</html>
